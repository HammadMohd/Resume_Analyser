[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-analyzer"
version = "0.1.0"
description = "Production ATS Resume Analyzer"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

authors = [
    { name = "Hammad Mohd" }
]

dependencies = [
    "fastapi[standard]>=0.115.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

parser = [
    "pdfplumber>=0.11.0",
    "pymupdf>=1.25.0",
    "pdfminer.six>=20231228",
    "python-docx>=1.1.0",
    "pytesseract>=0.3.13",
]

nlp = [
    "spacy>=3.8.0",
    "nltk>=3.9.0",
    "rapidfuzz>=3.11.0",
]

search = [
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.6.0",
    "sentence-transformers>=3.3.0",
]

llm = [
    "openai>=1.58.0",
    "instructor>=1.7.0",
]

database = [
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
]

cache = [
    "redis>=5.2.0",
]

queue = [
    "celery>=5.4.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["tests*", "docker*", "docs*", "frontend*", "uploads*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "C4",
    "SIM",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"